# GOLD-v1 — Cardios clinical evidence retrieval evaluation set
#
# Corpus: 2021 ESC Guidelines for the diagnosis and treatment of acute and
#         chronic heart failure (European Heart Journal 2021;42:3599-3726).
#
# Labels reference stable SOURCE locations. `pages` are PDF page indices (the
# citation surface shows the printed folio, 3599-3726). `evidence_span` is
# copied verbatim from the extracted guideline text and is the primary matcher —
# it is invariant to chunk size and overlap, which the Phase-3 sweep varies.
#
# Composition: 11 in_scope · 3 ambiguous · 4 out_of_domain · 2 unsafe_request
# out_of_domain and unsafe_request carry no gold evidence by design: they are
# the negative distribution for sufficiency calibration.

# ---------------------------------------------------------------- in scope --
- id: HF-01
  question: What is the recommended initial diagnostic test for a patient with symptoms suggestive of heart failure?
  category: in_scope
  expected_behaviour: answer
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [19]
      evidence_span: Plasma concentrations of NPs are recommended as initial diagnostic tests in patients with symptoms suggestive of HF
  min_gold_hits: 1

- id: HF-02
  question: Which imaging investigation does the guideline recommend as the key assessment of cardiac function in suspected heart failure?
  category: in_scope
  expected_behaviour: answer
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [19]
      evidence_span: Echocardiography is recommended as the key investigation for the assessment of cardiac function
  min_gold_hits: 1

- id: HF-03
  question: Are SGLT2 inhibitors recommended for patients with heart failure with reduced ejection fraction?
  category: in_scope
  expected_behaviour: answer
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [11]
      evidence_span: Dapagliflozin or empagliflozin are recommended for patients with HFrEF to reduce the risk of HF hospitalization
  min_gold_hits: 1

- id: HF-04
  question: What does the guideline say about using sacubitril/valsartan in place of an ACE inhibitor?
  category: in_scope
  expected_behaviour: answer
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [92]
      evidence_span: Sacubitril/valsartan is recommended as a replacement for an ACE-I in patients with HFrEF
  min_gold_hits: 1

- id: HF-05
  question: Which diuretic therapy is recommended to relieve congestion in heart failure with reduced ejection fraction?
  category: in_scope
  expected_behaviour: answer
  paraphrased_blind: true
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [24, 25]
      evidence_span: Loop diuretics are recommended to reduce the signs and/or symp- toms of congestion in patients with HFrEF
  min_gold_hits: 1

- id: HF-06
  question: When should oxygen be given to a patient with acute heart failure?
  category: in_scope
  expected_behaviour: answer
  paraphrased_blind: true
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [93]
      evidence_span: Oxygen is recommended in patients with SpO
  min_gold_hits: 1

- id: HF-07
  question: What ejection fraction threshold and duration of optimal medical therapy are required before implanting an ICD for primary prevention?
  category: in_scope
  expected_behaviour: answer
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [28]
      evidence_span: ICD implantation is recommended only if a minimum of 3 months of OMT has failed to increase the LVEF
  min_gold_hits: 1

- id: HF-08
  question: For which QRS duration and morphology is cardiac resynchronization therapy recommended?
  category: in_scope
  expected_behaviour: answer
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [13]
      evidence_span: CRT is recommended for symptomatic patients with HF in sinus rhythm with a QRS duration of
  min_gold_hits: 1


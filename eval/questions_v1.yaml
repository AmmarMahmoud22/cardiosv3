  question: Is ivabradine appropriate for a symptomatic patient in sinus rhythm with a resting heart rate above 70 bpm?
  category: in_scope
  expected_behaviour: answer
  paraphrased_blind: true
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure

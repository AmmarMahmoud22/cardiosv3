# --------------------------------------------------------------- ambiguous --
- id: AMB-01
  question: What is the best drug for heart failure?
  category: ambiguous
  expected_behaviour: clarify
  notes: >-
    No single answer exists. Treatment depends on the LVEF phenotype, so the
    system should either qualify heavily or ask for the phenotype. Reported
    separately and excluded from threshold fitting.
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [11]
      evidence_span: are recommended for patients with HFrEF to reduce the risk of HF hospitalization
  min_gold_hits: 1


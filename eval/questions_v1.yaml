    answerable for a specific unnamed patient.
  gold_evidence:
    - document: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
      pages: [14]
      evidence_span: Beta-blockers should be considered for short- and long-
  min_gold_hits: 1

- id: AMB-03
  question: What follow-up is needed after a heart failure admission?
  category: ambiguous
  expected_behaviour: answer
  notes: Broad but genuinely covered by the guideline's discharge-planning recommendations.
  gold_evidence:
